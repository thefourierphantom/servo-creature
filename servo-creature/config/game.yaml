# ============================================================
# game.yaml — NSBE Tilt Arena
# streamlined Pi build
# ============================================================

fps: 25

display:
  width: 1280
  height: 720
  fullscreen: false

mpu_poll_hz: 35

debug_overlay: false
show_fps: false

theme:
  brand: "NSBE"
  title: "NSBE Tilt Arena"
  accent: gold

attract:
  idle_timeout_sec: 45

freeplay:
  idle_timeout_sec: 30

easy:
  prompt_duration_sec: 5.0
  prompt_count: 8
  recenter_window_sec: 2.8

reflex:
  prompt_duration_sec: 2.2
  prompt_count: 12
  recenter_window_sec: 2.0
  miss_penalty_pts: 0
  time_bonus_max_pts: 40

boss:
  prompt_duration_sec: 1.45
  prompt_count: 14
  recenter_window_sec: 2.0
  fake_chance: 0.15
  inversion_chance: 0.15
  miss_penalty_pts: 20

scoring:
  base_hit_pts: 100
  combo_mult_step: 0.5
  combo_mult_cap: 4.0

ui:
  flash_hit_sec: 0.12
  flash_miss_sec: 0.16
  result_hold_sec: 0.34
  score_popup_sec: 0.55
  threat_bar_max: 5

calibration:
  hold_sec: 0.35
  return_delay_sec: 1.0
