# ============================================================
# prompts.yaml — Tilt Trial Arena / Mission Breach
# Prompt definitions for Reflex and Boss modes.
#
# axis:   roll | pitch | accel | none
# target: 1 (positive direction) | -1 (negative) | 0 (hold/still)
# weight: relative frequency (higher = appears more often)
# ============================================================

reflex_prompts:
  - id: left
    display: "← LEFT"
    axis: roll
    target: -1
    weight: 3

  - id: right
    display: "RIGHT →"
    axis: roll
    target: 1
    weight: 3

  - id: up
    display: "↑ UP"
    axis: pitch
    target: -1
    weight: 3

  - id: down
    display: "↓ DOWN"
    axis: pitch
    target: 1
    weight: 3

  - id: hold
    display: "◉ HOLD"
    axis: none
    target: 0
    weight: 2

  - id: shake
    display: "≋ SHAKE"
    axis: accel
    target: 1
    weight: 2

  - id: freeze
    display: "❄ FREEZE"
    axis: none
    target: 0
    weight: 1

# Boss mode extends reflex with these additional prompts.
boss_extra_prompts:
  - id: full_tilt
    display: "⚡ FULL TILT"
    axis: roll
    target: 1
    weight: 1
    note: "Max roll — push to limit"

  - id: nose_up
    display: "▲ NOSE UP"
    axis: pitch
    target: -1
    weight: 1

  - id: nose_down
    display: "▼ NOSE DOWN"
    axis: pitch
    target: 1
    weight: 1

# Fake-out labels used in Boss mode (player must do OPPOSITE of display)
boss_fakeouts:
  - "⚠ DODGE LEFT"
  - "⚠ DODGE RIGHT"
  - "⚠ DUCK"
  - "⚠ LEAN"
  - "⚠ PUSH"
